<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Resultado da Consulta</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background-color: #e5e7eb;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

    .container {
        width: 500px;
        height: 440px;
        background-image: url("teste1.png");
        background-size: 100% 100%;
        background-repeat: no-repeat;
        padding: 10px 10px 5px 10px;
        position: relative;
        box-sizing: border-box;

        display: flex;
        flex-direction: column;
    }

    #resultado {
        color: black;
        font-size: 16px;
        line-height: 1.5;
        white-space: pre-wrap;
        text-align: left;

        max-height: 260px;     
        overflow-y: auto;     
        margin-top: 90px;      
        margin-bottom: 70px;     
        padding: 0 5px;    
    }

    #resultado::-webkit-scrollbar {
        width: 6px;
    }
    #resultado::-webkit-scrollbar-thumb {
        background-color: rgba(0,0,0,0.4);
        border-radius: 3px;
    }

</style>
</head>
<body>

  <div class="container" role="main">
    <div id="resultado">Carregando...</div>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const tipo = params.get("tipo");
const valor = params.get("valor");
const resultadoDiv = document.getElementById("resultado");

async function buscar() {
    let url = "";
    let bodyData = {};

    if (tipo === "ator") {
        url = "http://127.0.0.1:8000/actor_search";
        bodyData = { ator: valor };
    } else if (tipo === "filme") {
        url = "http://127.0.0.1:8000/movie_search";
        bodyData = { titulo: valor };
    } else if (tipo === "diretor") {
        url = "http://127.0.0.1:8000/director_search";
        bodyData = { diretor: valor };
    } else {
        resultadoDiv.innerHTML = "Tipo de busca não suportado.";
        return;
    }

    try {
        const response = await fetch(url, { 
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(bodyData)
        });

        const data = await response.json();
        let html = `<strong>Busca por:</strong> ${tipo} <br><br>`;

        if (tipo === "ator") {
            if (data.result && data.result.length > 0) {
                const filmes = data.result.map(item => item.movie_title).filter(Boolean); 
                html += `<strong>Nome do Ator:</strong> ${valor}<br><br>`;
                html += `<strong>Filmes:</strong> ${filmes.join(', ')}`;
            } else {
                html += "Nenhum resultado encontrado.";
            }
        } else {
            if (data.result && data.result.length > 0) {
                data.result.forEach(item => {
                    html += `<div style="margin-bottom:10px;">`;
                    if (item.movie) html += `<strong>Filme:</strong> ${item.movie}<br>`;
                    if (item.movie_title) html += `<strong>Filme:</strong> ${item.movie_title}<br>`;
                    if (item.actors && item.actors.length > 0) html += `<strong>Atores:</strong> ${item.actors.join(', ')}<br>`;
                    if (item.director && item.director.length > 0) html += `<strong>Diretor:</strong> ${item.director.join(', ')}<br>`;
                    html += `</div>`;
                });
            } else {
                html += "Nenhum resultado encontrado.";
            }
        }
        resultadoDiv.innerHTML = html;

    } catch (error) {
        resultadoDiv.innerHTML = "Erro ao conectar com a API.";
        console.error(error);
    }
}

buscar();
</script>

</body>
</html>
