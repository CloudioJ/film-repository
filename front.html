<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Consulta à Ontologia - Filmes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box; 
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 500px;
            height: 440px;
            background-image: url("teste1.png");
            background-size: 100% 100%; 
            background-repeat: no-repeat;
            padding: 80px 40px 40px 40px;
            position: relative;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        select,
        input {
            width: 100%;
            height: 40px;             
            padding: 8px 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            width: 100%;
            height: 40px;
            background-color: white;   
            color: black;            
            border: 2px solid black;  
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease; 
        }

        button:hover {
            background-color: black;
            color: white;
        }

        input,
        select,
        button {
            font-family: 'Poppins', sans-serif;
        }

        input::placeholder {
            font-family: 'Poppins', sans-serif;
        }

    </style>
</head>
<body>

<div class="container">
    <h2>Sua busca cinematográfica começa aqui!</h2>

    <label for="tipoBusca">Selecione por onde quer começar:</label>
    <select id="tipoBusca">
        <option value="filme">Nome do Filme</option>
        <option value="ator">Nome do Ator</option>
        <option value="diretor">Diretor</option>
    </select>

    <label for="consulta">Digite sua pesquisa:</label>
    <input type="text" id="consulta" placeholder="Ex: Quentin Tarantino, Titanic, Leonardo DiCaprio">

    <button onclick="abrirResultado()">Pesquisar</button>

    <script>
    function abrirResultado() {
        const tipo = document.getElementById("tipoBusca").value;
        const texto = document.getElementById("consulta").value.trim();

        if (texto === "") {
            alert("Digite algo para pesquisar!");
            return;
        }
        window.location.href = `resultado.html?tipo=${encodeURIComponent(tipo)}&valor=${encodeURIComponent(texto)}`;
    }
    </script>

    <div class="resultado" id="resultado"></div>
</div>

</body>
</html>
