<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Consulta à Ontologia - Filmes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box; 
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            height: 100vh;
            background-image: url("teste1.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
        }

        .main-title {
            position: absolute;
            top: 20%; 
            left: 3%;
            font-size: 33px;
            font-weight: 600;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            white-space: nowrap; 
        }

        .search-container {
            position: absolute;
            top: 40%; 
            left: 5%; 
            width: 500px;
            max-width: 700px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
        }

        select,
        input {
            width: 100%;
            height: 45px; 
            padding: 8px 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px; 
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        button {
            width: 100%;
            height: 45px; 
            background-color: #000000; 
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
        }

        button:hover {
            background-color: #f6121d;
        }

        input::placeholder {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body>

<div class="main-title">Sua busca cinematográfica começa aqui!</div>

<div class="search-container">
    <label for="tipoBusca">Selecione por onde quer começar:</label>
    <select id="tipoBusca">
        <option value="filme">Nome do Filme</option>
        <option value="ator">Nome do Ator</option>
        <option value="diretor">Diretor</option>
    </select>

    <label for="consulta">Digite sua pesquisa:</label>
    <input type="text" id="consulta" placeholder="Ex: Quentin Tarantino, Inglourious Basterds, Leonardo DiCaprio">

    <button onclick="abrirResultado()">Pesquisar</button>
</div>

<script>
function abrirResultado() {
    const tipo = document.getElementById("tipoBusca").value;
    const texto = document.getElementById("consulta").value.trim();

    if (texto === "") {
        alert("Digite algo para pesquisar!");
        return;
    }
    window.location.href = `resultado.html?tipo=${encodeURIComponent(tipo)}&valor=${encodeURIComponent(texto)}`;
}
</script>

</body>
</html>
